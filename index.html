<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1613">
<title>Graham Tell</title>
<style>
:root{--bg:#0e1613;--card:#141e1a;--line:#26342f;--ink:#ece9e1;--mute:#98a39e;--gold:#dba642;--onGold:#1a1405}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}
.logo{display:block;margin:12px auto 32px;max-width:220px;max-height:110px}
.wordmark{font:600 38px/1.1 Georgia,"Times New Roman",serif;text-align:center;margin:20px 0 32px;letter-spacing:.01em}
input[type=search]{width:100%;padding:15px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input::placeholder{color:var(--mute)}
input:focus,button:focus-visible,a.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.acoes{display:grid;gap:12px;margin-top:20px}
.btn{display:block;width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:center;text-decoration:none;cursor:pointer}
.btn.primario{background:var(--gold);border-color:var(--gold);color:var(--onGold);font-weight:600}
.btn[aria-expanded=true]{border-color:var(--gold)}
#painel{margin-top:24px}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item b{display:block;font-weight:600}
.item span,.vazio,.nota{color:var(--mute);font-size:14px}
.linha{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.total{font:600 28px Georgia,serif;margin:0 0 8px}
h2{font:600 18px Georgia,serif;margin:24px 0 4px}
</style>
</head>
<body>
<main>
  <img class="logo" id="logo" src="logo.png" alt="Graham Tell" hidden>
  <h1 class="wordmark" id="nome">Graham Tell</h1>

  <input type="search" id="busca" placeholder="Buscar empresa pelo nome" autocomplete="off" aria-label="Buscar empresa">

  <div class="acoes">
    <a class="btn primario" id="cadastrar" href="cadastrar.html">Cadastrar empresa</a>
    <button class="btn" id="resumo" aria-expanded="false">Resumo por segmento e plano</button>
    <button class="btn" id="lista" aria-expanded="false">Empresas cadastradas</button>
  </div>

  <section id="painel" aria-live="polite"></section>
</main>

<script>
// Ajuste aqui se o endereço do formulário de cadastro for outro.
const CADASTRAR_URL = "cadastrar.html";
const SB_URL = "https://pgjtoshuznaujwxvfglc.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnanRvc2h1em5hdWp3eHZmZ2xjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTIzMjMsImV4cCI6MjEwMDg2ODMyM30.9MI94pCkqQsSUx5auyKFuomSx4o5NG1saaZoHYglTEQ";

const $ = id => document.getElementById(id);
const painel = $("painel");
$("cadastrar").href = CADASTRAR_URL;

// Usa logo.png se existir; senão mostra o nome em texto.
const img = $("logo");
img.onload = () => { img.hidden = false; $("nome").hidden = true; };
img.onerror = () => { img.remove(); };
if (img.complete && img.naturalWidth) img.onload();

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, extra = {}) {
  const r = await fetch(SB_URL + "/rest/v1/" + path, {
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, ...extra }
  });
  if (!r.ok) throw new Error(r.status);
  return r;
}

function marcar(botao) {
  ["resumo", "lista"].forEach(id => $(id).setAttribute("aria-expanded", id === botao));
}

function mostrarEmpresas(rows) {
  if (!rows.length) { painel.innerHTML = '<p class="vazio">Nenhuma empresa encontrada.</p>'; return; }
  painel.innerHTML = rows.map(e => {
    const local = [e.bairro, e.cidade].filter(Boolean).join(", ");
    return `<div class="item"><b>${esc(e.nome)}</b><span>${esc(local)}</span></div>`;
  }).join("");
}

async function carregarLista(termo = "") {
  painel.innerHTML = '<p class="vazio">Carregando…</p>';
  try {
    const filtro = termo ? "&nome=ilike.*" + encodeURIComponent(termo) + "*" : "";
    const r = await api("estabelecimentos?select=id,nome,bairro,cidade&order=nome&limit=100" + filtro);
    mostrarEmpresas(await r.json());
  } catch { painel.innerHTML = '<p class="vazio">Não foi possível carregar. Verifique a conexão e tente de novo.</p>'; }
}

async function carregarResumo() {
  painel.innerHTML = '<p class="vazio">Carregando…</p>';
  try {
    const rt = await api("estabelecimentos?select=id", { Prefer: "count=exact", Range: "0-0" });
    const total = (rt.headers.get("content-range") || "").split("/")[1] || "0";
    const seg = await (await api("segmentos?select=nome,estabelecimento_segmentos(count)&order=nome")).json();

    let html = `<p class="total">${esc(total)}</p><span class="nota">empresas cadastradas</span>`;
    html += "<h2>Por segmento</h2>";
    html += seg.length
      ? seg.map(s => `<div class="linha"><span>${esc(s.nome)}</span><b>${s.estabelecimento_segmentos?.[0]?.count ?? 0}</b></div>`).join("")
      : '<p class="vazio">Nenhum segmento cadastrado.</p>';

    html += "<h2>Por plano</h2>";
    try {
      const planos = await (await api("estabelecimentos?select=plano")).json();
      const cont = {};
      planos.forEach(p => { const k = p.plano || "Sem plano"; cont[k] = (cont[k] || 0) + 1; });
      html += Object.keys(cont).length
        ? Object.entries(cont).map(([k, v]) => `<div class="linha"><span>${esc(k)}</span><b>${v}</b></div>`).join("")
        : '<p class="vazio">Nenhuma empresa cadastrada.</p>';
    } catch {
      html += '<p class="vazio">A coluna “plano” ainda não existe na tabela de empresas.</p>';
    }
    painel.innerHTML = html;
  } catch { painel.innerHTML = '<p class="vazio">Não foi possível carregar. Verifique a conexão e tente de novo.</p>'; }
}

$("resumo").onclick = () => { marcar("resumo"); carregarResumo(); };
$("lista").onclick = () => { marcar("lista"); carregarLista(); };

let t;
$("busca").addEventListener("input", e => {
  clearTimeout(t);
  const v = e.target.value.trim();
  t = setTimeout(() => {
    if (!v) { painel.innerHTML = ""; marcar(""); return; }
    marcar(""); carregarLista(v);
  }, 300);
});
</script>
</body>
</html>
